<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so a saved theme never flashes the other one.
			try {
				var theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
				}
			} catch (e) {}
		</script>
		<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#061A2B" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
